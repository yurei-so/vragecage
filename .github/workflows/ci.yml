name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/VrageCage.CoreTests/VrageCage.CoreTests.csproj
      - run: dotnet run --project src/VrageCage.Cli/VrageCage.Cli.csproj -- scenarios/flat-seek.json > /tmp/vragecage-trace.jsonl
      - run: worker/tests/test-scripts.sh
      - run: bash -n scripts/*.sh worker/*.sh worker/tests/*.sh
      - run: python3 -m py_compile bin/vragecage worker/*.py
      - run: bin/vragecage --help
      - run: VRAGECAGE_CLI_BIN="$RUNNER_TEMP/bin" scripts/install-cli.sh
      - run: '"$RUNNER_TEMP/bin/vragecage" --help'
